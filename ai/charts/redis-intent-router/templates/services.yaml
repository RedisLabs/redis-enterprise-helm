{{- include "redis-onprem.controlplane.service" (dict
  "root" .
  "name" (include "redis-intent-router.controlplaneName" .)
  "component" "controlplane"
  "labelsTemplate" "redis-intent-router.labels"
  "selectorLabelsTemplate" "redis-intent-router.selectorLabels"
  "type" .Values.controlplane.service.type
  "port" .Values.controlplane.service.port
) }}
---
{{ include "redis-onprem.dataplane.service" (dict
  "root" .
  "name" (include "redis-intent-router.dataplaneName" .)
  "component" "dataplane"
  "labelsTemplate" "redis-intent-router.labels"
  "selectorLabelsTemplate" "redis-intent-router.selectorLabels"
  "type" .Values.dataplane.service.type
  "port" .Values.dataplane.service.port
) }}
