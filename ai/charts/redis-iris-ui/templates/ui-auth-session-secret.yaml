{{- if and .Values.sso.enabled (not .Values.sso.session.existingSecret) }}
{{- /*
The session encryption key (TDD SECRET-1): generated once and reused on upgrade. The service uses
the file's exact bytes as the passphrase, and the generated value has no trailing newline. Rotating
it signs every user out; stop all replicas and start them again rather than rolling.

The key is kept across `helm upgrade` only because `lookup` finds the Secret already in the cluster. `lookup`
returns nothing under `helm template`, `helm install --dry-run` and renderers that call `helm template`
(Argo CD, Flux, Helmfile), so there every render generates a new key. Anyone rendering outside
`helm install` / `helm upgrade` must set sso.session.existingSecret.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ui.auth.sessionSecretName" . }}
  labels:
    {{- include "ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui-auth
type: Opaque
data:
  {{ .Values.sso.session.secretKey }}: {{ include "redis-onprem.lookupOrGenerateSecretToken" (dict "namespace" .Release.Namespace "name" (include "ui.auth.sessionSecretName" .) "key" .Values.sso.session.secretKey) }}
{{- end }}
