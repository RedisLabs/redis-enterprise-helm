{{- if and (not .Values.controlplane.adminToken.existingSecret) .Values.controlplane.adminToken.autoGenerate }}
{{- /*
  Lookup-or-generate the admin-token Secret. On first install we mint a random
  token; on upgrade we re-read the existing value via `lookup` so the token is
  stable across upgrades and an operator's manual rotation is never clobbered.
  BYO deployments set adminToken.existingSecret and this template renders
  nothing for it.
*/}}
{{- $name := include "langcache.controlplaneAdminTokenSecretName" . }}
{{- $key := .Values.controlplane.adminToken.secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if and $existing (index $existing.data $key) }}
{{- $token = index $existing.data $key }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "langcache.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $key }}: {{ $token }}
{{- end }}
{{- if and (not .Values.controlplane.internalToken.existingSecret) .Values.controlplane.internalToken.autoGenerate }}
{{- if and (not .Values.controlplane.adminToken.existingSecret) .Values.controlplane.adminToken.autoGenerate }}
---
{{- end }}
{{- /*
  Lookup-or-generate the internal grant-validation token, consumed by
  /internal/v1/grants/validate and, in bundled Identity Service mode, by
  identityService.bundled's product_validation.langcache credential by
  default. Intentionally separate from the admin token.
*/}}
{{- $name := include "langcache.controlplaneInternalTokenSecretName" . }}
{{- $key := .Values.controlplane.internalToken.secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if and $existing (index $existing.data $key) }}
{{- $token = index $existing.data $key }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "langcache.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $key }}: {{ $token }}
{{- end }}
