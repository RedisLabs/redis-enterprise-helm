{{- if eq .Values.identityService.mode "bundled" }}
{{- $bundled := .Values.identityService.bundled -}}
{{- $renderedAny := false -}}
{{- if and (not $bundled.controlToken.existingSecret) $bundled.controlToken.autoGenerate }}
{{- /*
  Lookup-or-generate the Identity Service Control admin credential. Unlocks
  IdS Control only; intentionally separate from the Control Plane admin
  token. Stable across upgrades via `lookup`; never clobbers a manual
  rotation.
*/}}
{{- $name := include "langcache.identityServiceControlTokenSecretName" . }}
{{- $key := $bundled.controlToken.secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if and $existing (index $existing.data $key) }}
{{- $token = index $existing.data $key }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "langcache.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-service
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $key }}: {{ $token }}
{{- $renderedAny = true -}}
{{- end }}
{{- if and (not $bundled.runtime.dataplaneCredential.existingSecret) $bundled.runtime.dataplaneCredential.autoGenerate }}
{{- if $renderedAny }}
---
{{- end }}
{{- /*
  Lookup-or-generate the Data Plane's own Identity Service runtime credential
  for API-key introspection. Mounted into both this bundled Identity Service
  (as its one runtime.service_credentials entry) and the Data Plane itself.
*/}}
{{- $name := include "langcache.identityServiceDataplaneCredentialSecretName" . }}
{{- $key := $bundled.runtime.dataplaneCredential.secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if and $existing (index $existing.data $key) }}
{{- $token = index $existing.data $key }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "langcache.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-service
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $key }}: {{ $token }}
{{- end }}
{{- end }}
