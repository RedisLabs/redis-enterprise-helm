{{- $queueMonitor := .Values.controlplane.queueMonitor -}}
{{- if and $queueMonitor $queueMonitor.enabled $queueMonitor.ingress.enabled }}
{{- $authAnnotations := dict "nginx.ingress.kubernetes.io/auth-type" "basic" "nginx.ingress.kubernetes.io/auth-secret" $queueMonitor.auth.existingSecret "nginx.ingress.kubernetes.io/auth-secret-type" "auth-file" "nginx.ingress.kubernetes.io/auth-realm" "Redis Agent Memory queue monitor" -}}
{{- $annotations := mergeOverwrite (default (dict) $queueMonitor.ingress.annotations) $authAnnotations -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "redis-agent-memory.queueMonitorFullname" . }}
  labels:
    {{- include "redis-agent-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: queue-monitor
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- with $queueMonitor.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $queueMonitor.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ $queueMonitor.ingress.host | quote }}
      secretName: {{ $queueMonitor.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $queueMonitor.ingress.host | quote }}
      http:
        paths:
          - path: {{ $queueMonitor.ingress.path }}
            pathType: {{ $queueMonitor.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "redis-agent-memory.queueMonitorFullname" $ }}
                port:
                  number: {{ $queueMonitor.service.port }}
{{- end }}
