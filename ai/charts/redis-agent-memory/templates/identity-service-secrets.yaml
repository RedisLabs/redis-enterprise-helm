{{- $ids := default (dict) .Values.identityService -}}
{{- if and $ids.enabled (not $ids.controlToken.existingSecret) $ids.controlToken.autoGenerate }}
{{- /*
  Lookup-or-generate the IdS Control admin-token Secret. The token unlocks IdS
  Control only and is intentionally separate from product CP admin/internal
  credentials.
*/}}
{{- $name := include "redis-agent-memory.identityServiceControlTokenSecretName" . }}
{{- $key := $ids.controlToken.secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if and $existing (index $existing.data $key) }}
{{- $token = index $existing.data $key }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "redis-agent-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-service
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $key }}: {{ $token }}
{{- end }}
{{- if and $ids.enabled $ids.runtime $ids.runtime.serviceCredentials }}
{{- $renderedControlToken := and (not $ids.controlToken.existingSecret) $ids.controlToken.autoGenerate -}}
{{- range $i, $credential := $ids.runtime.serviceCredentials }}
{{- if and (not $credential.existingSecret) $credential.autoGenerate }}
{{- if or $renderedControlToken (gt $i 0) }}
---
{{- end }}
{{- /*
  Lookup-or-generate one IdS Runtime service credential. These credentials are
  presented by product DPs/CPs when calling the IdS Runtime API.
*/}}
{{- $name := include "redis-agent-memory.identityServiceRuntimeCredentialSecretName" (dict "root" $ "credential" $credential) }}
{{- $key := $credential.secretKey }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- $token := "" }}
{{- if and $existing (index $existing.data $key) }}
{{- $token = index $existing.data $key }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "redis-agent-memory.labels" $ | nindent 4 }}
    app.kubernetes.io/component: identity-service
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $key }}: {{ $token }}
{{- end }}
{{- end }}
{{- end }}
