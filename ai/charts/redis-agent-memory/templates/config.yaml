{{- if and .Values.config.render (not .Values.config.existingSecret) }}
{{- /*
  Chart-rendered data-plane config ConfigMap. Enabled with config.render=true as
  an alternative to bringing your own config.existingSecret. The body is
  assembled from .Values.shared + .Values.memory (see the dataplaneConfig helper)
  and contains STRUCTURE ONLY — no Redis connection URLs and no API keys. Every
  credential lives inside a mounted secret overlay (secrets.secretName plus any
  secrets.additionalSecrets) and is deep-merged over this config by the loader at
  runtime, so a ConfigMap (not a Secret) is the honest carrier here.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis-agent-memory.configName" . }}
  labels:
    {{- include "redis-agent-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  {{ .Values.config.secretKey }}: |
{{ include "redis-agent-memory.dataplaneConfig" . | indent 4 }}
{{- end }}
