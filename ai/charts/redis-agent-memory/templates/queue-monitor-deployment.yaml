{{- $queueMonitor := .Values.controlplane.queueMonitor -}}
{{- if and $queueMonitor $queueMonitor.enabled }}
{{- include "redis-agent-memory.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redis-agent-memory.queueMonitorFullname" . }}
  labels:
    {{- include "redis-agent-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: queue-monitor
spec:
  replicas: {{ $queueMonitor.replicaCount }}
  selector:
    matchLabels:
      {{- include "redis-agent-memory.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: queue-monitor
  template:
    metadata:
      annotations:
        checksum/redis-secret-name: {{ $queueMonitor.redis.existingSecret | sha256sum | quote }}
        {{- with $queueMonitor.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "redis-agent-memory.labels" . | nindent 8 }}
        app.kubernetes.io/component: queue-monitor
        {{- with $queueMonitor.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "redis-agent-memory.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: asynqmon
          {{- with $queueMonitor.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $queueMonitor.image.repository }}:{{ $queueMonitor.image.tag }}"
          imagePullPolicy: {{ $queueMonitor.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ $queueMonitor.service.port | quote }}
            - name: READ_ONLY
              value: {{ $queueMonitor.readOnly | quote }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $queueMonitor.redis.existingSecret }}
                  key: {{ $queueMonitor.redis.urlKey }}
            {{- if $queueMonitor.redis.tlsServerNameKey }}
            - name: REDIS_TLS
              valueFrom:
                secretKeyRef:
                  name: {{ $queueMonitor.redis.existingSecret }}
                  key: {{ $queueMonitor.redis.tlsServerNameKey }}
                  optional: true
            {{- end }}
            {{- if $queueMonitor.redis.insecureTLSKey }}
            - name: REDIS_INSECURE_TLS
              valueFrom:
                secretKeyRef:
                  name: {{ $queueMonitor.redis.existingSecret }}
                  key: {{ $queueMonitor.redis.insecureTLSKey }}
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $queueMonitor.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          {{- with $queueMonitor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      {{- with $queueMonitor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $queueMonitor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $queueMonitor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
