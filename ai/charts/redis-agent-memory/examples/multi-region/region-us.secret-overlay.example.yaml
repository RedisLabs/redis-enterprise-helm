# US regional secret overlay — plaintext contents of the ram-us-secrets Secret.
#
# This is NOT a Helm values file. It is the YAML overlay that the config loader
# deep-merges over the base config at runtime. It holds ALL of this region's
# credentials in one document: the embedder/LLM API keys AND the full Redis
# connection strings (credentials live INSIDE the URL). Create the per-region
# Secret with:
#
#   kubectl create secret generic ram-us-secrets \
#     --from-file=overlay.yaml=./region-us.secret-overlay.example.yaml
#
# Same shape as region-eu.secret-overlay.example.yaml with US endpoints. Named by
# secrets.secretName in region-us.yaml, so it is the region's single (index 0)
# overlay: mounted at /etc/ai/overlays/0/overlay.yaml and passed as a --config arg
# after the base config. The shared API keys are duplicated here per region.
embedders_connection_details:
  openai:
    credentials:
      api_key: sk-REPLACE-ME
metadata:
  stores:
    "00000000000000000000000000000001":
      urls:
        - redis://user:pass@redis-store-us.internal:6379
background_jobs:
  redis:
    urls:
      - redis://user:pass@redis-jobs-us.internal:6379
