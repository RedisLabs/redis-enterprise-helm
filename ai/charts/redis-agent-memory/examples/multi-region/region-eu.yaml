# EU region overrides. Merged on top of base-values.yaml.
#
#   helm install ram-eu ../.. -f base-values.yaml -f region-eu.yaml --set image.tag=<VER>
#
# Only the non-secret regional deltas live here: the region identity, the
# regions this deployment owns, and the ingress host. The API keys and Redis
# connection strings (with credentials) live in the ram-eu-secrets Secret — see
# region-eu.secret-overlay.example.yaml — never in this file.
secrets:
  # This region's single credentials Secret: API keys + Redis connection strings
  # in one overlay document, mounted and merged over the base config at runtime.
  secretName: ram-eu-secrets

memory:
  request_region:
    default: eu1
  background_jobs:
    redis:
      # Logical regions this deployment owns/processes.
      worker_regions:
        - eu1

ingress:
  enabled: true
  hosts:
    - host: memory-eu.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: ram-eu-tls
      hosts:
        - memory-eu.example.com
