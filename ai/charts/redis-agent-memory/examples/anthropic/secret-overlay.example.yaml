# Credentials overlay for the Anthropic example — plaintext contents of the
# ram-secrets Secret. This is NOT a Helm values file; the config loader
# deep-merges it over the rendered config at runtime.
#
# Replace ../basic/secret-overlay.example.yaml with this file, or add the
# promote_session_memory, session_summarisation and classification blocks to it.
#   kubectl create secret generic ram-secrets \
#     --from-file=overlay.yaml=./secret-overlay.example.yaml
#
# After you change a key, restart the Memory data plane and worker workloads:
# Memory reads credentials when it builds its clients.
embedders_connection_details:
  openai:
    credentials:
      api_key: sk-REPLACE-ME
promote_session_memory:
  strategies:
    instruct:
      llm:
        credentials:
          api_key: sk-ant-REPLACE-ME
session_summarisation:
  llm:
    credentials:
      api_key: sk-ant-REPLACE-ME
classification:
  llm:
    credentials:
      api_key: sk-ant-REPLACE-ME
metadata:
  urls:
    - redis://user:pass@redis-metadata:6379
databases:
  "1":
    urls:
      - redis://user:pass@redis-store:6379
background_jobs:
  redis:
    urls:
      - redis://user:pass@redis-jobs:6379
