# Credentials overlay for the Vertex AI example — plaintext contents of the
# ram-secrets Secret. This is NOT a Helm values file; the config loader
# deep-merges it over the rendered config at runtime.
#
# Replace ../basic/secret-overlay.example.yaml with this file. It holds the Vertex
# service-account keys, a placeholder key for the unused openai embedder that
# ../basic/values.yaml defines, and the Redis URLs:
#   kubectl create secret generic ram-secrets \
#     --from-file=overlay.yaml=./secret-overlay.example.yaml
#
# Paste the service-account key JSON as a block scalar. After you replace the
# key, run `kubectl rollout restart` on the Memory data plane and worker
# workloads: Memory reads credentials when it builds its clients.
embedders_connection_details:
  # ../basic/values.yaml also defines an openai embedder. Memory validates every
  # embedder at startup, so it needs a key even though no role uses it. Give it any
  # non-empty placeholder, or remove the openai entry from your merged values.
  openai:
    credentials:
      api_key: sk-REPLACE-ME
  vertex:
    credentials:
      gcp:
        service_account_json: |
          {"type": "service_account", "project_id": "REPLACE_PROJECT", "...": "REPLACE-ME"}
promote_session_memory:
  strategies:
    instruct:
      llm:
        credentials:
          gcp:
            service_account_json: |
              {"type": "service_account", "project_id": "REPLACE_PROJECT", "...": "REPLACE-ME"}
session_summarisation:
  llm:
    credentials:
      gcp:
        service_account_json: |
          {"type": "service_account", "project_id": "REPLACE_PROJECT", "...": "REPLACE-ME"}
classification:
  llm:
    credentials:
      gcp:
        service_account_json: |
          {"type": "service_account", "project_id": "REPLACE_PROJECT", "...": "REPLACE-ME"}
metadata:
  urls:
    - redis://user:pass@redis-metadata:6379
databases:
  "1":
    urls:
      - redis://user:pass@redis-store:6379
background_jobs:
  redis:
    urls:
      - redis://user:pass@redis-jobs:6379
