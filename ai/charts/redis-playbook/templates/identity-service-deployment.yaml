{{- define "redis-playbook.identityServiceAnnotations" -}}
checksum/config: {{ toJson (dict "service" .Values.identityService.service "runtimeCache" .Values.identityService.runtimeCache "controlplaneURL" (include "redis-playbook.controlplaneBaseURL" .) "security" .Values.security) | sha256sum | quote }}
{{- with .Values.storage.existingSecretChecksum }}
checksum/storage-secret: {{ . | quote }}
{{- end }}
{{- with .Values.identityService.controlToken.existingSecretChecksum }}
checksum/control-token: {{ . | quote }}
{{- end }}
{{- with .Values.identityService.runtimeToken.existingSecretChecksum }}
checksum/runtime-token: {{ . | quote }}
{{- end }}
{{- with .Values.controlplane.internalToken.existingSecretChecksum }}
checksum/product-validation-token: {{ . | quote }}
{{- end }}
{{- if and .Values.tls.caCertSecret .Values.tls.caCertSecretChecksum }}
checksum/tls-ca: {{ .Values.tls.caCertSecretChecksum | quote }}
{{- end }}
{{- end }}

{{- define "redis-playbook.identityServiceArgs" -}}
- --config
- /etc/identity-service/config/identity-service.yaml
- --config
- /etc/identity-service/metadata/metadata.yaml
{{- end }}

{{- define "redis-playbook.identityServiceEnv" -}}
- name: IDS_SECURITY_PROFILE
  value: {{ .Values.security.profile | quote }}
{{ include "redis-playbook.commonEnv" . }}
{{- end }}

{{- define "redis-playbook.identityServiceVolumeMounts" -}}
- name: config
  mountPath: /etc/identity-service/config
  readOnly: true
- name: metadata
  mountPath: /etc/identity-service/metadata
  readOnly: true
- name: control-token
  mountPath: /etc/identity-service/credentials/control
  readOnly: true
- name: runtime-token
  mountPath: /etc/identity-service/credentials/runtime
  readOnly: true
- name: product-validation-token
  mountPath: /etc/identity-service/credentials/product-validation
  readOnly: true
{{ include "redis-playbook.commonTLSMount" . }}
{{- end }}

{{- define "redis-playbook.identityServiceVolumes" -}}
- name: config
  configMap:
    name: {{ include "redis-playbook.identityServiceName" . }}-config
- name: metadata
  secret:
    secretName: {{ required "storage.existingSecret is required" .Values.storage.existingSecret }}
    items:
      - key: {{ .Values.storage.identityServiceKey }}
        path: metadata.yaml
- name: control-token
  secret:
    secretName: {{ include "redis-playbook.identityServiceControlTokenSecretName" . }}
    items:
      - key: {{ .Values.identityService.controlToken.secretKey }}
        path: token
- name: runtime-token
  secret:
    secretName: {{ include "redis-playbook.identityServiceRuntimeTokenSecretName" . }}
    items:
      - key: {{ .Values.identityService.runtimeToken.secretKey }}
        path: token
- name: product-validation-token
  secret:
    secretName: {{ include "redis-playbook.controlplaneInternalTokenSecretName" . }}
    items:
      - key: {{ .Values.controlplane.internalToken.secretKey }}
        path: token
{{ include "redis-playbook.commonTLSVolume" . }}
{{- end }}

{{- include "redis-onprem.identityService.deployment" (dict
  "root" .
  "name" (include "redis-playbook.identityServiceName" .)
  "component" "identity-service"
  "labelsTemplate" "redis-playbook.labels"
  "selectorLabelsTemplate" "redis-playbook.selectorLabels"
  "replicas" .Values.identityService.replicaCount
  "annotationsTemplate" "redis-playbook.identityServiceAnnotations"
  "podAnnotations" .Values.identityService.podAnnotations
  "podLabels" .Values.identityService.podLabels
  "imagePullSecrets" .Values.imagePullSecrets
  "serviceAccountName" (include "redis-playbook.serviceAccountName" .)
  "automountServiceAccountToken" false
  "podSecurityContext" .Values.podSecurityContext
  "containerName" "identity-service"
  "argsTemplate" "redis-playbook.identityServiceArgs"
  "containerSecurityContext" .Values.securityContext
  "image" .Values.identityService.image
  "envTemplate" "redis-playbook.identityServiceEnv"
  "port" .Values.identityService.service.port
  "livenessProbe" (dict "httpGet" (dict "path" "/v1/health/live" "port" "http") "initialDelaySeconds" 5 "periodSeconds" 10)
  "readinessProbe" (dict "httpGet" (dict "path" "/v1/health/ready" "port" "http") "initialDelaySeconds" 3 "periodSeconds" 5)
  "resources" .Values.identityService.resources
  "volumeMountsTemplate" "redis-playbook.identityServiceVolumeMounts"
  "volumesTemplate" "redis-playbook.identityServiceVolumes"
  "nodeSelector" .Values.identityService.nodeSelector
  "affinity" .Values.identityService.affinity
  "tolerations" .Values.identityService.tolerations
) }}
