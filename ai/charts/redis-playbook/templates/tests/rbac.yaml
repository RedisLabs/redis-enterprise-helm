{{- if .Values.tests.enabled }}
{{ include "redis-onprem.serviceAccount" (dict
  "root" .
  "create" true
  "name" (include "redis-playbook.testServiceAccountName" .)
  "labelsTemplate" "redis-playbook.labels"
  "annotations" (dict)
  "automount" true
) }}
---
{{ include "redis-onprem.tests.rbac" (dict
  "root" .
  "enabled" true
  "name" (include "redis-playbook.testRBACName" .)
  "labelsTemplate" "redis-playbook.labels"
  "serviceAccountName" (include "redis-playbook.testServiceAccountName" .)
  "resourceNames" (list
    (include "redis-playbook.controlplaneName" .)
    (include "redis-playbook.dataplaneName" .)
    (include "redis-playbook.identityServiceName" .)
  )
) }}
{{- end }}
