{{- /*
Umbrella-generated credentials (MOD-20390), a bootstrap (MOD-20913): with generate: true the chart
creates fresh credentials as pre-install,pre-upgrade hook Secrets, and never reuses, adopts or
overwrites an existing one. If any expected name below already exists, the render fails, listing
them, before any hook runs; the administrator hands the credentials over to external references
(README "Hand over generated credentials") and continues with generate: false. A Secret created
under an expected name after the lookup fails the hook instead: hook-delete-policy hook-failed
keeps Helm from deleting it first (the default before-hook-creation would), Helm 3 then gets 409
AlreadyExists, and Helm 4, which applies hooks server-side, conflicts on the immutable `type`,
whose random suffix a competitor cannot match. Hooks are not part of the release manifest, so a
rollback never restores an older value and uninstall leaves them behind. A generator Job that
replaces these hooks (MOD-20909) must fail on 409 Conflict and never read the existing Secret.

The expected names (only these are looked up): each enabled product's two Secrets, whose keys match
the supplied aggregates (global.iris.secrets.*), and each consumer mounts only its own key:
  iris-memory-dataplane-credential  memory-dp  Memory data plane -> Identity Service introspection
  iris-memory-internal-token        memory     Identity Service -> Memory control plane grant validation
  iris-playbook-dataplane-credential  playbook-dp  Playbook data plane -> Identity Service introspection
  iris-playbook-internal-token        playbook     Identity Service -> Playbook control plane grant validation
  iris-lens-dataplane-credential, iris-lens-internal-token                        lens-dp, lens
  iris-context-gateway-dataplane-credential, iris-context-gateway-internal-token  context-gateway-dp, context-gateway
  iris-intent-dataplane-credential, iris-intent-internal-token                    intent-dp, intent
Single-value Secrets render (and are expected) only while their consumer still references the
generated name, so an operator who points a reference at their own Secret gets no generated one:
  iris-<product>-admin-token (key token), iris-identity-service-control-token, iris-ui-session-key
  gateway-keyring (MOD-21051): one base64 32-byte key per contextGateway.credentialStorage.redis.keyFiles
    file (k1), while Context Gateway is on with provider redis and its keyring reference names it.
    Never regenerated: a new key would leave the stored Upstream credentials unreadable. Keys are
    written only at creation, so a keyFiles entry added later needs its key patched in first.
The cluster CA (MOD-21051): with global.tls.caCertSecret unset, cluster-ca (key ca.crt) is copied
from the release namespace's ConfigMap kube-root-ca.crt; nothing renders while that ConfigMap is
absent (helm template, or a namespace that --create-namespace creates during the install). Both
are expected names: an existing gateway-keyring or cluster-ca fails the bootstrap like the others.
With renderMode: gitops, or with generate: false, nothing here renders and no lookup runs.
*/ -}}
{{- /* The generated keyring's key file names as a JSON list, or "" when the chart generates none. */}}
{{- define "redis-iris.gatewayKeyring" -}}
{{- if .Values.global.iris.products.contextGateway.enabled -}}
{{- $storage := default (dict) .Values.contextGateway.credentialStorage -}}
{{- if and (eq (toString $storage.provider) "redis") (eq (toString (dig "redis" "keyring" "existingSecret" "" $storage)) "gateway-keyring") -}}
{{- $files := list -}}
{{- range $id, $file := (default (dict) $storage.redis.keyFiles) }}{{ $files = append $files $file }}{{ end -}}
{{- toJson ($files | uniq) -}}
{{- end -}}
{{- end -}}
{{- end }}
{{- if and .Values.global.iris.secrets.generate (eq .Values.global.iris.renderMode "helm") }}
{{- $secrets := list }}
{{- /* key: the alias and global.iris.products key; id: the product id in Secret names and keys. */}}
{{- range $p := list (dict "key" "memory" "id" "memory") (dict "key" "playbook" "id" "playbook") (dict "key" "lens" "id" "lens") (dict "key" "contextGateway" "id" "context-gateway") (dict "key" "intent" "id" "intent") }}
{{- if (index $.Values.global.iris.products $p.key).enabled }}
{{- $secrets = append $secrets (dict "name" (printf "iris-%s-dataplane-credential" $p.id) "keys" (list (printf "%s-dp" $p.id))) }}
{{- $secrets = append $secrets (dict "name" (printf "iris-%s-internal-token" $p.id) "keys" (list $p.id)) }}
{{- with (index $.Values $p.key).controlplane.adminToken }}
{{- if eq .existingSecret (printf "iris-%s-admin-token" $p.id) }}
{{- $secrets = append $secrets (dict "name" .existingSecret "keys" (list (default "token" .secretKey))) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.identityService.control }}
{{- if eq .existingSecret "iris-identity-service-control-token" }}
{{- $secrets = append $secrets (dict "name" .existingSecret "keys" (list .secretKey)) }}
{{- end }}
{{- end }}
{{- with .Values.ui.sso.session }}
{{- if eq .existingSecret "iris-ui-session-key" }}
{{- $secrets = append $secrets (dict "name" .existingSecret "keys" (list .secretKey)) }}
{{- end }}
{{- end }}
{{- /* data: precomputed values, written as is (keys get randAlphaNum 48 each). */}}
{{- with include "redis-iris.gatewayKeyring" . }}
{{- $data := dict }}
{{- /* randBytes is already base64 text, the key file format (openssl rand -base64 32). */}}
{{- range fromJsonArray . }}{{- $_ := set $data . (randBytes 32) }}{{- end }}
{{- $secrets = append $secrets (dict "name" "gateway-keyring" "data" $data) }}
{{- end }}
{{- /* ponytail: created once like the other generated credentials, so a rotated cluster CA needs the
Secret patched; refresh it on every upgrade if rotation becomes routine. */}}
{{- if not (dig "tls" "caCertSecret" "" .Values.global) }}
{{- with dig "data" "ca.crt" "" (lookup "v1" "ConfigMap" .Release.Namespace "kube-root-ca.crt") }}
{{- $secrets = append $secrets (dict "name" "cluster-ca" "data" (dict "ca.crt" .)) }}
{{- end }}
{{- end }}
{{- $existing := list }}
{{- range $secrets }}
{{- if lookup "v1" "Secret" $.Release.Namespace .name }}{{ $existing = append $existing .name }}{{ end }}
{{- end }}
{{- with $existing }}
{{- $hint := ternary " To keep a cluster-ca you created, set global.tls.caCertSecret=cluster-ca instead: the chart then generates none." "" (has "cluster-ca" .) }}
{{- fail (printf "global.iris.secrets.generate: true creates new credentials, but these Secrets with generated credential names already exist in namespace %s: %s. Existing credentials are never accepted automatically. Do not delete them if the suite uses them: keep their values, follow the external-credentials handover (redis-iris README, \"Hand over generated credentials\"; scripts/handover-credentials.sh), set the existingSecret references and global.iris.secrets.generate=false, then retry. Only after a failed first install (helm history %s -n %s lists the release with no deployed revision) does nothing use them yet: helm uninstall %s -n %s (it leaves these Secrets), kubectl -n %s delete secret %s, then install again.%s" $.Release.Namespace (join ", " (sortAlpha .)) $.Release.Name $.Release.Namespace $.Release.Name $.Release.Namespace $.Release.Namespace (join " " (sortAlpha .)) $hint) }}
{{- end }}
{{- range $secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: redis-iris
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: credentials
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: hook-failed
    helm.sh/resource-policy: keep
type: iris.redis.io/credential-{{ randAlphaNum 16 | lower }}
data:
  {{- range .keys }}
  {{ . }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
  {{- range $k, $v := .data }}
  {{ $k }}: {{ $v | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
