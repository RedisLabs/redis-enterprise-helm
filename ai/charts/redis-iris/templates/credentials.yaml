{{- /*
Umbrella-generated credentials (MOD-20390). Each Secret is a pre-install,pre-upgrade hook that
renders only while `lookup` finds no Secret of that name, so a value is generated once and then
left alone: an upgrade keeps it, an out-of-band rotation survives upgrade and rollback (hooks
are not part of the release manifest, so a rollback cannot restore an older value), and
uninstall leaves it behind for a reinstall to reuse.

Each enabled product gets its own two Secrets, so enabling a product on upgrade creates new
Secrets and never needs a key added to an existing one. The keys match the supplied aggregates
(global.iris.secrets.*), and each consumer mounts only its own key:
  iris-memory-dataplane-credential  memory-dp  Memory data plane -> Identity Service introspection
  iris-memory-internal-token        memory     Identity Service -> Memory control plane grant validation
  iris-playbook-dataplane-credential  playbook-dp  Playbook data plane -> Identity Service introspection
  iris-playbook-internal-token        playbook     Identity Service -> Playbook control plane grant validation
  iris-lens-dataplane-credential, iris-lens-internal-token                        lens-dp, lens
  iris-context-gateway-dataplane-credential, iris-context-gateway-internal-token  context-gateway-dp, context-gateway
  iris-intent-dataplane-credential, iris-intent-internal-token                    intent-dp, intent
Single-value Secrets render only while their consumer still references the generated name, so
an operator who points a reference at their own Secret gets no generated one:
  iris-<product>-admin-token (key token), iris-identity-service-control-token, iris-ui-session-key
With renderMode: gitops, or with generate: false, nothing here renders and no lookup runs.
*/ -}}
{{- if and .Values.global.iris.secrets.generate (eq .Values.global.iris.renderMode "helm") }}
{{- $secrets := list }}
{{- /* key: the alias and global.iris.products key; id: the product id in Secret names and keys. */}}
{{- range $p := list (dict "key" "memory" "id" "memory") (dict "key" "playbook" "id" "playbook") (dict "key" "lens" "id" "lens") (dict "key" "contextGateway" "id" "context-gateway") (dict "key" "intent" "id" "intent") }}
{{- if (index $.Values.global.iris.products $p.key).enabled }}
{{- $secrets = append $secrets (dict "name" (printf "iris-%s-dataplane-credential" $p.id) "keys" (list (printf "%s-dp" $p.id))) }}
{{- $secrets = append $secrets (dict "name" (printf "iris-%s-internal-token" $p.id) "keys" (list $p.id)) }}
{{- with (index $.Values $p.key).controlplane.adminToken }}
{{- if eq .existingSecret (printf "iris-%s-admin-token" $p.id) }}
{{- $secrets = append $secrets (dict "name" .existingSecret "keys" (list (default "token" .secretKey))) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.identityService.control }}
{{- if eq .existingSecret "iris-identity-service-control-token" }}
{{- $secrets = append $secrets (dict "name" .existingSecret "keys" (list .secretKey)) }}
{{- end }}
{{- end }}
{{- with .Values.ui.sso.session }}
{{- if eq .existingSecret "iris-ui-session-key" }}
{{- $secrets = append $secrets (dict "name" .existingSecret "keys" (list .secretKey)) }}
{{- end }}
{{- end }}
{{- range $secrets }}
{{- if not (lookup "v1" "Secret" $.Release.Namespace .name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: redis-iris
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: credentials
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range .keys }}
  {{ . }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
