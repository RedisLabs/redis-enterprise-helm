apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "iris-identity-service.fullname" . }}
  labels:
    {{- include "iris-identity-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-service
data:
  identity-service.yaml: |
{{ include "iris-identity-service.config" . | indent 4 }}
  wiring.yaml: |
{{ include "iris-identity-service.wiringConfig" . | indent 4 }}
