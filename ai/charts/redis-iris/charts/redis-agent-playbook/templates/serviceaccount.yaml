{{- include "redis-onprem.serviceAccount" (dict
  "root" .
  "create" .Values.serviceAccount.create
  "name" (include "redis-agent-playbook.serviceAccountName" .)
  "labelsTemplate" "redis-agent-playbook.labels"
  "annotations" .Values.serviceAccount.annotations
  "automount" false
) }}
{{- if (include "redis-agent-playbook.suite" . | fromJson).extraction.connection.enabled }}
---
{{ include "redis-onprem.serviceAccount" (dict
  "root" .
  "create" true
  "name" (include "redis-agent-playbook.controlplaneServiceAccountName" .)
  "labelsTemplate" "redis-agent-playbook.labels"
  "annotations" .Values.serviceAccount.annotations
  "automount" false
) }}
{{- end }}
{{- if and (include "redis-agent-playbook.suite" . | fromJson).extraction.connection.enabled (include "redis-agent-playbook.suite" . | fromJson).worker.enabled }}
---
{{ include "redis-onprem.serviceAccount" (dict
  "root" .
  "create" true
  "name" (include "redis-agent-playbook.workerServiceAccountName" .)
  "labelsTemplate" "redis-agent-playbook.labels"
  "annotations" .Values.serviceAccount.annotations
  "automount" false
) }}
{{- end }}
