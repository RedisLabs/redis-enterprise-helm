{{- $suite := include "redis-agent-playbook.suite" . | fromJson -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis-agent-playbook.dataplaneName" . }}-config
  labels:
    {{- include "redis-agent-playbook.labels" . | nindent 4 }}
    app.kubernetes.io/component: dataplane
data:
  playbook-dataplane.yaml: |
    profile: prod
    tenant_id: {{ $suite.tenantId | quote }}
    server:
      host: 0.0.0.0
      port: {{ .Values.dataplane.service.port }}
      timeout: 30s
      read_timeout: 30s
      write_timeout: 35s
    auth:
      method: agent_key
      admin_token:
        token_file: /etc/playbook/credentials/admin/token
      agent_keys:
        enabled: true
        product: playbook
        introspection:
          base_url: {{ include "redis-agent-playbook.identityServiceBaseURL" . | quote }}
          product: playbook
          {{- /* validation.yaml admits http:// only with identityService.allowInsecureTransport outside fips. */}}
          {{- if not (hasPrefix "https://" (include "redis-agent-playbook.identityServiceBaseURL" .)) }}
          allow_insecure_transport: true
          {{- end }}
          credential:
            token_file: /etc/identity-service/runtime/playbook-dp/token
      {{- if $suite.dataplaneOIDC.enabled }}
      oidc:
        {{- include "redis-agent-playbook.oidcValidation" . | nindent 8 }}
        audience:
          {{- toYaml (list (trim $suite.audience)) | nindent 10 }}
      {{- end }}
      {{- if $suite.extraction.connection.enabled }}
      {{- $external := $suite.extraction.connection.workerSubjects }}
      {{- if $suite.worker.enabled }}
      {{- $external = without $external (include "redis-agent-playbook.workerSubject" .) }}
      {{- end }}
      {{- if $external }}
      service_subjects:
        enabled: true
        issuer: {{ $suite.extraction.connection.issuer | quote }}
        audience: [api://playbook-dp]
        jwks_uri: {{ $suite.extraction.connection.jwksURI | quote }}
        subjects:
          {{- toYaml $external | nindent 10 }}
        allow_insecure_transport: {{ $suite.extraction.connection.allowInsecureTransport }}
      {{- end }}
      {{- if $suite.worker.enabled }}
      worker_identity:
        enabled: true
        issuer: {{ $suite.extraction.connection.issuer | quote }}
        audience: [api://playbook-dp]
        jwks_uri: {{ $suite.extraction.connection.jwksURI | quote }}
        subjects:
          - subject: {{ include "redis-agent-playbook.workerSubject" . | quote }}
            resources:
              "playbook:*": {permissions: [read, propose]}
        allow_insecure_transport: {{ $suite.extraction.connection.allowInsecureTransport }}
      {{- end }}
      {{- end }}
    {{- if .Values.extraction.connection.enabled }}
    {{- $extractionWorkers := .Values.extraction.connection.workerSubjects }}
    {{- if .Values.worker.enabled }}
    {{- $chartWorker := include "redis-agent-playbook.workerSubject" . }}
    {{- $extractionWorkers = append (without $extractionWorkers $chartWorker) $chartWorker }}
    {{- end }}
    {{- if $extractionWorkers }}
    {{- /* Extraction workers are recognized by verified issuer and subject, so their consolidation searches are not metered as customer searches. */}}
    extraction_workers:
      {{- range $extractionWorkers }}
      - issuer: {{ $.Values.extraction.connection.issuer | quote }}
        subject: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- end }}
    license:
      license_path: /etc/playbook/license/{{ $suite.license.secretKey }}
    storage:
      key_prefix: {{ .Values.storage.keyPrefix | quote }}
      max_playbooks_per_tenant: {{ .Values.storage.maxPlaybooksPerTenant }}
    inference:
      models:
        {{- toYaml .Values.inference.models | nindent 8 }}
    opentelemetry:
      enable_tracing: {{ .Values.tracing.enabled }}
      otlp_grpc_endpoint: {{ .Values.tracing.otlpGRPCEndpoint | quote }}
    trace_capture: {{ .Values.tracing.capture | quote }}
