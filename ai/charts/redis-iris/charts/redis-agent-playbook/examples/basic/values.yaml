tenantId: default

# Enables the health and shared security-profile checks run by `helm test`.
tests:
  enabled: true

controlplane:
  image:
    repository: registry.example.com/redis/playbook-controlplane-onprem
    tag: 1.0.0
  adminToken:
    existingSecret: playbook-controlplane-admin
  internalToken:
    existingSecret: playbook-controlplane-internal

dataplane:
  image:
    repository: registry.example.com/redis/playbook-dataplane-onprem
    tag: 1.0.0
  # The Identity Service release's Service in the same namespace.
  identityServiceBaseURL: http://iris-identity-service:9200

# The Identity Service release installed first in the same namespace. Its
# release must register the playbook-dp credential and the Playbook validator.
identityService:
  allowInsecureTransport: true
  credential:
    existingSecret: playbook-dp-credential

license:
  existingSecret: playbook-license

storage:
  existingSecret: playbook-storage

# Illustrative external-provider configuration, not a supported-model promise.
# Keep this identity identical to prerequisites.example.yaml's private overlay.
inference:
  existingSecret: playbook-inference
  models:
    - provider: openai
      model: text-embedding-3-small
      dimensions: 1536
