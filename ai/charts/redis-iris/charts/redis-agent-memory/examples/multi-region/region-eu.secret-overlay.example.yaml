# EU regional secret overlay — plaintext contents of the ram-eu-secrets Secret.
#
# This is NOT a Helm values file. It is the YAML overlay that the config loader
# deep-merges over the base config at runtime. It holds ALL of this region's
# credentials in one document: the embedder/LLM API keys AND the full Redis
# connection strings (credentials live INSIDE the URL). Create the per-region
# Secret with:
#
#   kubectl create secret generic ram-eu-secrets \
#     --from-file=overlay.yaml=./region-eu.secret-overlay.example.yaml
#
# This Secret is named by secrets.secretName in region-eu.yaml, so it is the
# region's single (index 0) overlay: the chart mounts it at
# /etc/ai/overlays/0/overlay.yaml and passes it to the binary as a --config arg
# after the base config. The shared API keys are duplicated here per region (we
# keep few, so this is simpler than a separate shared Secret). The keys mirror the
# config's own snake_case paths.
embedders_connection_details:
  openai:
    credentials:
      api_key: sk-REPLACE-ME
metadata:
  urls:
    - redis://user:pass@redis-metadata-eu.internal:6379
databases:
  "1":
    urls:
      - redis://user:pass@redis-store-eu.internal:6379
background_jobs:
  redis:
    urls:
      - redis://user:pass@redis-jobs-eu.internal:6379
