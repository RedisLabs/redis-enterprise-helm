# values-fips.yaml
#
# Opt-in overlay for the FIPS-oriented on-prem posture described in the plan
# "FIPS posture for on-prem Agent Memory". Apply alongside your normal
# values file, for example:
#
#   helm upgrade --install redis-agent-memory redis-agent-memory/ \
#     --values values.yaml \
#     --values values-fips.yaml \
#     --set image.tag=<ram-version> \
#     --set config.existingSecret=<your-config-secret> \
#     --set license.existingSecret=<your-license-secret>
#
# Selecting this overlay:
#
#   1. Sets global.security.profile=fips, so every application container
#      starts with GODEBUG=fips140=on. Set the same global.security.profile on
#      the Identity Service release. See memory/helm/README.md for the exact
#      effects and the conservative compliance wording we use.
#
#   2. Does NOT automatically rewrite your config Secret. The config file
#      you mount through config.existingSecret must also:
#        - remove skip_verify=true from every outbound HTTP client;
#        - remove allow_insecure_transport=true from every auth block
#          (auth.oidc, auth.agent_keys.introspection, auth.worker_identity).
#          That flag relaxes URL-scheme validation for the block's endpoints,
#          so leaving it on would send bearer material over plaintext HTTP.
#          It is rejected even when the owning block is disabled;
#        - use rediss:// (TLS) URLs for every Redis connection, including
#          background_jobs.redis.urls, metadata.urls, and databases.*.urls.
#      The binary fails startup with a joined error list if any of those
#      rules is violated while security.profile=fips, so catching this at
#      install time rather than config-bake time is the intended workflow.
#
#   3. Requires TLS on the data plane's Identity Service hop. The chart
#      refuses identityService.allowInsecureTransport=true and any http://
#      dataplane.identityServiceBaseURL, so set the connection in your main
#      values file with an https:// URL, for example:
#        dataplane:
#          identityServiceBaseURL: https://identity-service.example.com
#        identityService:
#          credential:
#            existingSecret: memory-dp-credential
#        controlplane:
#          internalToken:
#            existingSecret: memory-internal-token
#      The Identity Service release's memory validator must also call the
#      control plane over https:// (it refuses to start otherwise).
#
# This file intentionally only sets the security toggle. Keep your resource
# sizing, autoscaling, ingress, and image config in your main values file.

global:
  security:
    profile: fips
