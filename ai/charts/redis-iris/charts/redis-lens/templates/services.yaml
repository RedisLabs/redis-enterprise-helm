{{- include "redis-onprem.dataplane.service" (dict
  "root" .
  "name" (include "redis-lens.dataplaneName" .)
  "component" "dataplane"
  "labelsTemplate" "redis-lens.labels"
  "selectorLabelsTemplate" "redis-lens.selectorLabels"
