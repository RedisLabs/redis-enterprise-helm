{{- range $credential := list
  (dict "values" .Values.controlplane.adminToken "name" (include "redis-lens.controlplaneAdminTokenSecretName" .) "component" "controlplane")
  (dict "values" .Values.controlplane.internalToken "name" (include "redis-lens.controlplaneInternalTokenSecretName" .) "component" "controlplane" "suite" (include "redis-lens.suite" . | fromJson).internalToken.suite) }}
{{- /* Under redis-iris the suite supplies the internal token; the chart generates none. */}}
{{- if and (not $credential.suite) (not $credential.values.existingSecret) $credential.values.autoGenerate }}
{{- $key := $credential.values.secretKey }}
{{- $token := include "redis-onprem.lookupOrGenerateSecretToken" (dict "namespace" $.Release.Namespace "name" $credential.name "key" $key) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credential.name }}
  labels:
    {{- include "redis-lens.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $credential.component }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $key }}: {{ $token }}
{{- end }}
{{- end }}
