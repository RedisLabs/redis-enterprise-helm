# Embedder Secret for Cohere. inference.models in values must name the same
# identity (provider: cohere, model: embed-v5.0-pro, dimensions: 2048).
# Intent has no LLM role, so only embeddings are configured.
apiVersion: v1
kind: Secret
metadata:
  name: intent-inference
type: Opaque
stringData:
  inference.yaml: |
    embedders_connection_details:
      cohere:
        protocol: cohere
        base_url: https://api.cohere.ai/compatibility/v1
        credentials:
          type: static
          api_key: <cohere-api-key>
