# Embedder Secret for Vertex AI. inference.models in values must name the same
# identity (provider: vertex, model: gemini-embedding-001, dimensions: 1536).
# After you replace the key, change inference.existingSecretChecksum so the data
# plane rolls.
apiVersion: v1
kind: Secret
metadata:
  name: intent-inference
type: Opaque
stringData:
  inference.yaml: |
    embedders_connection_details:
      vertex:
        protocol: vertex-ai
        base_url: https://us-central1-aiplatform.googleapis.com/v1/projects/REPLACE_PROJECT/locations/us-central1/publishers/google/models/gemini-embedding-001:predict
        embeddings_input_field: content
        credentials:
          type: gcp-service-account
          gcp:
            service_account_json: |
              {"type": "service_account", "project_id": "REPLACE_PROJECT", "...": "REPLACE-ME"}
