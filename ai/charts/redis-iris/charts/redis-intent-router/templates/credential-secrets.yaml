{{- if and (not .Values.controlplane.adminToken.existingSecret) .Values.controlplane.adminToken.autoGenerate }}
{{- $name := include "redis-intent-router.controlplaneAdminTokenSecretName" . }}
{{- $key := .Values.controlplane.adminToken.secretKey }}
{{- $token := include "redis-onprem.lookupOrGenerateSecretToken" (dict "namespace" .Release.Namespace "name" $name "key" $key) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "redis-intent-router.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $key }}: {{ $token }}
{{- end }}
{{- /* Under redis-iris the suite supplies the internal token; the chart generates none. */}}
{{- if and (not (include "redis-intent-router.suite" . | fromJson).internalToken.suite) (not .Values.controlplane.internalToken.existingSecret) .Values.controlplane.internalToken.autoGenerate }}
{{- $name := include "redis-intent-router.controlplaneInternalTokenSecretName" . }}
{{- $key := .Values.controlplane.internalToken.secretKey }}
{{- $token := include "redis-onprem.lookupOrGenerateSecretToken" (dict "namespace" .Release.Namespace "name" $name "key" $key) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "redis-intent-router.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $key }}: {{ $token }}
{{- end }}
