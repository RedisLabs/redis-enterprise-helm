# M1 demo: the redis-iris suite with Agent Memory, release iris in namespace
# redis-ai, credentials generated by the umbrella, Admin Token mode in the UI.
# tests/kind.sh installs exactly this file (plus image tags) and runs helm test.
#
# Create these first in namespace redis-ai (tests/kind.sh shows each one):
#   ids-metadata  key metadata.yaml  the Identity Service metadata Redis overlay
#   iris-license  key license        the suite license (Agent Memory and Agent Playbook)
#   mem-secrets   key overlay.yaml   the Agent Memory Redis URLs and model credentials
#   cluster-ca    key ca.crt         the cluster CA, so the worker can verify the
#                                    Kubernetes ServiceAccount issuer
#
# The Memory configuration uses the noop embedder and noop inference
# (memory/tests/integration/onprem/aa-e2e/values), so the demo needs no model
# provider. Replace it with a real configuration for anything else.

global:
  iris:
    license:
      existingSecret: iris-license
      secretKey: license

identityService:
  metadata:
    existingSecret: ids-metadata

# Admin Token mode: operators paste each product's token, so no IdP, public URL,
# or Ingress is needed. For IdP login see examples/single-product.yaml.
ui:
  sso:
    enabled: false
  ingress:
    enabled: false

memory:
  secrets:
    secretName: mem-secrets
  # The worker verifies the cluster's ServiceAccount issuer over TLS.
  tls:
    caCertSecret: cluster-ca
  server:
    replicaCount: 1
    autoscaling:
      enabled: false
  worker:
    replicaCount: 1
    autoscaling:
      enabled: false
  controlplane:
    configData:
      profile: dev
      auth:
        type: admin-token
        admin_token:
          token_file: /etc/controlplane-onprem/admin/token
        internal_token:
          token_file: /etc/controlplane-onprem/internal/token
      embedding:
        dimensions: 384
  shared:
    databases:
      "1":
        name: default
  memory:
    profile: dev
    default_extraction_strategy: instruct
    request_region:
      default: eu1
    client_pool:
      enable: true
      max_size: 100
    background_jobs:
      redis:
        enabled: true
        queue_prefix: ram
        worker_regions: [eu1]
        defaults:
          concurrency: 2
          max_retry: 3
          timeout: 5m
          completed_retention: 1h
          requeue_without_retry_delay: 5s
          shutdown_timeout: 30s
      idempotency:
        enabled: true
        done_ttl: 24h
        lock_ttl: 5m
        lease_extension_interval: 1m
        operation_timeout: 5s
    embedding:
      provider: noop
      models:
        default_embedding_model: noop
        dimensions: 384
    embedders_connection_details:
      noop:
        protocol: noop
    session_summarisation:
      enabled: false
    session_summary_view:
      enabled: false
    inference_providers:
      openai:
        protocol: noop
        endpoint:
          base_url: https://api.openai.com/v1
          timeout: 30s
          auth_format: bearer
    classification:
      llm:
        provider: openai
        credentials:
          type: static
        models:
          default_chat_model: gpt-5.6-luna
    promote_session_memory:
      strategies:
        instruct:
          promotion_deduplication_window: 1s
          reasoning_effort: low
          llm:
            provider: openai
            credentials:
              type: static
            models:
              default_chat_model: gpt-4o
              dimensions: 384
