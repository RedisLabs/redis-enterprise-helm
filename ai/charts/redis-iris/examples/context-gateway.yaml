# Context Gateway values for the redis-iris suite, release iris in namespace
# redis-ai. Install it with the other product files (see examples/lens.yaml).
# Context Gateway is on by default (global.iris.products.contextGateway.enabled),
# so an upgrade from 0.4.0 needs this file too, or
# global.iris.products.contextGateway.enabled: false.
#
# publicBaseURL is the https origin MCP clients reach the data plane at. It is
# not derived from global.iris.publicURL (the UI's address). Route it either
# with the chart's Ingress below, or with your own routing to the Service
# redis-context-gateway-dataplane:8083 (then set dataplane.ingress.enabled: false).
#
# Create these first in namespace redis-ai (tests/kind.sh shows each one):
#   gateway-metadata          key config.yaml  metadata_db.urls (the Gateway metadata Redis)
#   gateway-credential-redis  key config.yaml  credential_storage.redis.urls (a separate Redis)
#   gateway-keyring           key k1           a base64 32-byte key: openssl rand -base64 32
#   mcp-tls                   kubernetes.io/tls for mcp.example.com
# The license, tenant, Identity Service connection, and credentials are the suite's.

contextGateway:
  publicBaseURL: https://mcp.example.com
  metadataDB:
    existingSecret: gateway-metadata
  credentialStorage:
    provider: redis
    redis:
      connection:
        existingSecret: gateway-credential-redis
      keyring:
        existingSecret: gateway-keyring
  dataplane:
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: mcp.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: mcp-tls
          hosts: [mcp.example.com]
