# Reference policies for redis-agent-playbook. Do not apply this file until every
# <placeholder> is replaced. The chart intentionally does not guess caller,
# Redis, DNS, ingress-controller, or service-mesh identities.
#
# <identity-service-namespace> and <identity-service-release-name> name the
# separate Identity Service release this chart connects to (this chart deploys
# none). For an https:// mesh or gateway endpoint, replace those selectors with
# that endpoint's approved identity, CIDR and port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: <release-name>-playbook-default-deny
  namespace: <namespace>
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis-agent-playbook
      app.kubernetes.io/instance: <release-name>
  policyTypes:
    - Ingress
    - Egress
---
# CP ingress: the Identity Service release's grant validator, the UI gateway,
# and approved administrators.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: <release-name>-playbook-controlplane
  namespace: <namespace>
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis-agent-playbook
      app.kubernetes.io/instance: <release-name>
      app.kubernetes.io/component: controlplane
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <identity-service-namespace>
          podSelector:
            matchLabels:
              app.kubernetes.io/name: iris-identity-service
              app.kubernetes.io/instance: <identity-service-release-name>
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <admin-caller-namespace>
          podSelector:
            matchLabels:
              <admin-caller-label-key>: <admin-caller-label-value>
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <ui-gateway-namespace>
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ui
              app.kubernetes.io/instance: <ui-release-name>
      ports:
        - {protocol: TCP, port: 9200}
  egress:
    # Binding grant preparation/revocation through Identity Service Control with
    # the control plane's own ServiceAccount JWT (MOD-19110), including when
    # extraction.enabled=false. Remove this rule if no RAM connection is
    # configured. If RAM or the control plane uses a different Identity Service
    # release (extraction.connection.identityServiceBaseURL or
    # destinationIdentityServiceBaseURL), add a rule for it too.
    # NetworkPolicy permits the port; the Identity Service enforces credentials.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <identity-service-namespace>
          podSelector:
            matchLabels:
              app.kubernetes.io/name: iris-identity-service
              app.kubernetes.io/instance: <identity-service-release-name>
      ports:
        - {protocol: TCP, port: 9200}
    # Live store discovery through RAM CP (MOD-19110). Remove this rule
    # without extraction.connection.ramControlPlaneBaseURL.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <ram-namespace>
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-agent-memory
              app.kubernetes.io/instance: <ram-release-name>
              app.kubernetes.io/component: controlplane
      ports:
        - {protocol: TCP, port: 9100}
    # Required when controlplane.oidc.enabled=true: the control plane fetches the
    # IdP's JWKS to validate operator tokens locally.
    - to:
        - ipBlock: {cidr: <idp-jwks-egress-cidr>}
      ports:
        - {protocol: TCP, port: <idp-port>}
    - to:
        - ipBlock: {cidr: <metadata-redis-cidr>}
        - ipBlock: {cidr: <content-redis-cidr>}
      ports:
        - {protocol: TCP, port: <redis-port>}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# DP ingress: UI gateway and approved API/MCP callers. Egress reaches the Identity
# Service release (agent-key introspection and worker grant lookup) plus both
# Redis deployments and the configured inference provider.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: <release-name>-playbook-dataplane
  namespace: <namespace>
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis-agent-playbook
      app.kubernetes.io/instance: <release-name>
      app.kubernetes.io/component: dataplane
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <api-caller-namespace>
          podSelector:
            matchLabels:
              <api-caller-label-key>: <api-caller-label-value>
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <ui-gateway-namespace>
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ui
              app.kubernetes.io/instance: <ui-release-name>
      ports:
        - {protocol: TCP, port: 9201}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <identity-service-namespace>
          podSelector:
            matchLabels:
              app.kubernetes.io/name: iris-identity-service
              app.kubernetes.io/instance: <identity-service-release-name>
      ports:
        - {protocol: TCP, port: 9200}
    # Resolve this against the provider's published ranges or an approved egress
    # proxy. Standard NetworkPolicy does not provide DNS-name allowlisting.
    - to:
        - ipBlock: {cidr: <inference-egress-cidr>}
      ports:
        - {protocol: TCP, port: <inference-port>}
    # Required when dataplane.oidc.enabled=true. Resolve the IdP/JWKS host
    # against published ranges or route it through an approved egress proxy.
    - to:
        - ipBlock: {cidr: <idp-jwks-egress-cidr>}
      ports:
        - {protocol: TCP, port: <idp-port>}
    - to:
        - ipBlock: {cidr: <metadata-redis-cidr>}
        - ipBlock: {cidr: <content-redis-cidr>}
      ports:
        - {protocol: TCP, port: <redis-port>}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
