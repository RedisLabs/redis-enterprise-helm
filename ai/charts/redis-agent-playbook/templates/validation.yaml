{{- $tenant := required "tenantId is required" .Values.tenantId -}}
{{- $storage := required "storage.existingSecret is required" .Values.storage.existingSecret -}}
{{- $license := required "license.existingSecret is required" .Values.license.existingSecret -}}
{{- $cpTag := required "controlplane.image.tag is required" .Values.controlplane.image.tag -}}
{{- $dpTag := required "dataplane.image.tag is required" .Values.dataplane.image.tag -}}
{{- $idsTag := required "identityService.image.tag is required" .Values.identityService.image.tag -}}
{{- if not .Values.inference.models -}}
{{- fail "inference.models must explicitly configure at least one embedding model" -}}
{{- end -}}
{{- if and (not .Values.controlplane.adminToken.existingSecret) (not .Values.controlplane.adminToken.autoGenerate) -}}
{{- fail "controlplane.adminToken: set existingSecret or autoGenerate=true" -}}
{{- end -}}
{{- if and (not .Values.controlplane.internalToken.existingSecret) (not .Values.controlplane.internalToken.autoGenerate) -}}
{{- fail "controlplane.internalToken: set existingSecret or autoGenerate=true" -}}
{{- end -}}
{{- if and (not .Values.identityService.controlToken.existingSecret) (not .Values.identityService.controlToken.autoGenerate) -}}
{{- fail "identityService.controlToken: set existingSecret or autoGenerate=true" -}}
{{- end -}}
{{- if and (not .Values.identityService.runtimeToken.existingSecret) (not .Values.identityService.runtimeToken.autoGenerate) -}}
{{- fail "identityService.runtimeToken: set existingSecret or autoGenerate=true" -}}
{{- end -}}
{{- $cpAdmin := include "redis-agent-playbook.controlplaneAdminTokenSecretName" . -}}
{{- $cpInternal := include "redis-agent-playbook.controlplaneInternalTokenSecretName" . -}}
{{- $idsControl := include "redis-agent-playbook.identityServiceControlTokenSecretName" . -}}
{{- $idsRuntime := include "redis-agent-playbook.identityServiceRuntimeTokenSecretName" . -}}
{{- $requiresInferenceSecret := false -}}
{{- range .Values.inference.models -}}
{{- if ne (lower (trim .provider)) "noop" -}}
{{- $requiresInferenceSecret = true -}}
{{- end -}}
{{- end -}}
{{- if and $requiresInferenceSecret (not .Values.inference.existingSecret) -}}
{{- fail "inference.existingSecret is required when a non-noop provider is configured" -}}
{{- end -}}
{{- if .Values.dataplane.oidc.enabled -}}
{{- $issuer := required "dataplane.oidc.issuer is required when OIDC is enabled" .Values.dataplane.oidc.issuer -}}
{{- $jwksURI := required "dataplane.oidc.jwksURI is required when OIDC is enabled" .Values.dataplane.oidc.jwksURI -}}
{{- $tenantIDClaim := trim .Values.dataplane.oidc.tenantIDClaim -}}
{{- $staticTenantID := trim .Values.dataplane.oidc.staticTenantID -}}
{{- if and (not $tenantIDClaim) (not $staticTenantID) -}}
{{- fail "dataplane.oidc requires tenantIDClaim or staticTenantID" -}}
{{- end -}}
{{- if and $tenantIDClaim $staticTenantID -}}
{{- fail "dataplane.oidc.tenantIDClaim and staticTenantID are mutually exclusive" -}}
{{- end -}}
{{- if and (not .Values.dataplane.oidc.allowInsecureTransport) (or (hasPrefix "http://" $issuer) (hasPrefix "http://" $jwksURI)) -}}
{{- fail "dataplane.oidc HTTP endpoints require allowInsecureTransport=true" -}}
{{- end -}}
{{- if and (eq .Values.security.profile "fips") (or .Values.dataplane.oidc.allowInsecureTransport (not (hasPrefix "https://" $issuer)) (not (hasPrefix "https://" $jwksURI))) -}}
{{- fail "FIPS requires HTTPS dataplane.oidc endpoints and allowInsecureTransport=false" -}}
{{- end -}}
{{- end -}}
{{- $adminRef := printf "%s/%s" $cpAdmin .Values.controlplane.adminToken.secretKey -}}
{{- $internalRef := printf "%s/%s" $cpInternal .Values.controlplane.internalToken.secretKey -}}
{{- $controlRef := printf "%s/%s" $idsControl .Values.identityService.controlToken.secretKey -}}
{{- $runtimeRef := printf "%s/%s" $idsRuntime .Values.identityService.runtimeToken.secretKey -}}
{{- $_ := include "redis-onprem.delegatedAuth.validate" (include "redis-agent-playbook.delegatedAuthOptions" . | fromJson) -}}
{{- if .Values.controlplane.delegatedAuth.enabled -}}
{{- if not .Values.dataplane.oidc.enabled -}}
{{- fail "controlplane.delegatedAuth requires dataplane.oidc.enabled for the Playbook browser token" -}}
{{- end -}}
{{- if not .Values.dataplane.oidc.roleMappings -}}
{{- fail "controlplane.delegatedAuth requires dataplane.oidc.roleMappings" -}}
{{- end -}}
{{- if and .Values.dataplane.oidc.staticTenantID (ne (trim .Values.dataplane.oidc.staticTenantID) (trim .Values.tenantId)) -}}
{{- fail "controlplane.delegatedAuth requires dataplane.oidc.staticTenantID to match tenantId" -}}
{{- end -}}
{{- if .Values.dataplane.oidc.allowInsecureTransport -}}
{{- fail "controlplane.delegatedAuth requires HTTPS OIDC endpoints because the Identity Service runs with profile=prod" -}}
{{- end -}}
{{- if and (hasPrefix "http://" (include "redis-agent-playbook.identityServiceBaseURL" .)) (not .Values.controlplane.delegatedAuth.allowInsecureTransport) -}}
{{- fail "controlplane.delegatedAuth requires allowInsecureTransport=true for an HTTP Identity Service endpoint" -}}
{{- end -}}
{{- if and (eq .Values.security.profile "fips") .Values.controlplane.delegatedAuth.allowInsecureTransport -}}
{{- fail "FIPS requires controlplane.delegatedAuth.allowInsecureTransport=false" -}}
{{- end -}}
{{- end -}}
{{- if or
  (eq $adminRef $internalRef)
  (eq $adminRef $controlRef)
  (eq $adminRef $runtimeRef)
  (eq $internalRef $controlRef)
  (eq $internalRef $runtimeRef)
  (eq $controlRef $runtimeRef) -}}
{{- fail "control-plane admin, product-validation, Identity Service control, and Identity Service runtime credentials must reference four different Secret keys" -}}
{{- end -}}
{{- $_ := include "redis-agent-playbook.identityServiceBaseURL" . -}}
{{- $_ := include "redis-agent-playbook.controlplaneBaseURL" . -}}
