{{- /*
  Chart-rendered Control Plane config ConfigMap.

  Skipped entirely when controlplane.config.existingSecret is set, so an
  operator can supply the whole control-plane config themselves.
*/}}
{{- if not .Values.controlplane.config.existingSecret }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis-agent-playbook.controlplaneName" . }}-config
  labels:
    {{- include "redis-agent-playbook.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
data:
  playbook-controlplane.yaml: |
    profile: prod
    tenant_id: {{ .Values.tenantId | quote }}
    server:
      host: 0.0.0.0
      port: {{ .Values.controlplane.service.port }}
      timeout: 30s
      read_timeout: 30s
      write_timeout: 35s
    auth:
      type: admin-token
      admin_token:
        token_file: /etc/playbook/credentials/admin/token
      internal_token:
        token_file: /etc/playbook/credentials/internal/token
      {{- if .Values.controlplane.oidc.enabled }}
      oidc:
        {{- include "redis-agent-playbook.oidcValidation" . | nindent 8 }}
        audience:
          {{- toYaml (list (trim .Values.auth.oidc.audience)) | nindent 10 }}
      {{- end }}
    license:
      license_path: /etc/playbook/license/{{ .Values.license.secretKey }}
    storage:
      key_prefix: {{ .Values.storage.keyPrefix | quote }}
      max_playbooks_per_tenant: {{ .Values.storage.maxPlaybooksPerTenant }}
    inference:
      models:
        {{- toYaml .Values.inference.models | nindent 8 }}
    opentelemetry:
      enable_tracing: {{ .Values.tracing.enabled }}
      otlp_grpc_endpoint: {{ .Values.tracing.otlpGRPCEndpoint | quote }}
    {{- if or .Values.extraction.enabled .Values.extraction.connection.enabled }}
    extraction:
      enabled: {{ .Values.extraction.enabled }}
      {{- $connection := .Values.extraction.connection }}
      {{- if $connection.enabled }}
      connection:
        enabled: true
        issuer: {{ required "extraction.connection.issuer is required" $connection.issuer | quote }}
        subjects:
          {{- include "redis-agent-playbook.extractionSubjects" . | nindent 10 }}
        identity_service:
          base_url: {{ include "redis-agent-playbook.sourceIdentityServiceBaseURL" . | quote }}
          token_file: /etc/playbook/credentials/extraction-ids-control/token
        destination_identity_service:
          base_url: {{ include "redis-agent-playbook.destinationIdentityServiceBaseURL" . | quote }}
          token_file: /etc/playbook/credentials/extraction-destination-ids-control/token
        {{- with $connection.ramControlPlaneBaseURL }}
        ram_control_plane:
          base_url: {{ . | quote }}
          token_file: /etc/playbook/credentials/extraction-ram-cp/token
        {{- end }}
        allow_insecure_transport: {{ or $connection.allowInsecureTransport .Values.identityService.allowInsecureTransport }}
      {{- end }}
    {{- end }}
{{- end }}
