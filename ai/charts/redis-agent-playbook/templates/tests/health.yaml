{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "redis-agent-playbook.fullname" . }}-health-test
  labels:
    {{- include "redis-agent-playbook.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: curlimages/curl:8.17.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      command:
        - sh
        - -ec
        - |
          curl --fail --silent --show-error http://{{ include "redis-agent-playbook.controlplaneName" . }}:{{ .Values.controlplane.service.port }}/v1/health/ready
          curl --fail --silent --show-error http://{{ include "redis-agent-playbook.dataplaneName" . }}:{{ .Values.dataplane.service.port }}/v1/health/ready
          curl --fail --silent --show-error http://{{ include "redis-agent-playbook.identityServiceName" . }}:{{ .Values.identityService.service.port }}/v1/health/ready
{{- end }}
