# Overlay on values-test.yaml for browser authentication, including Helm 3 release lint.
controlplane:
  oidc:
    enabled: true

dataplane:
  oidc:
    enabled: true
    issuer: https://issuer.example.test
    jwksURI: https://issuer.example.test/jwks
    staticTenantID: test-tenant
    roleMappings:
      playbook-admins: product_admin
