apiVersion: v1
kind: Pod
metadata:
  name: {{ include "iris-identity-service.fullname" . | trunc 51 | trimSuffix "-" }}-health-test
  labels:
    {{- include "iris-identity-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with include "iris-identity-service.imagePullSecrets" . | fromJsonArray }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: {{ .Values.tests.image | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      command:
        - sh
        - -ec
        - curl --fail --silent --show-error http://{{ include "iris-identity-service.fullname" . }}:{{ .Values.service.port }}/v1/health/ready
