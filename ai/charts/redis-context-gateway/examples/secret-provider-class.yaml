# Install the CSI driver and Vault provider first. Configure Vault's Kubernetes
# auth role gateway-files for the two generated ServiceAccounts in this namespace.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gateway-metadata
spec:
  provider: vault
  parameters:
    vaultAddress: https://vault.example.com:8200
    roleName: gateway-files
    objects: |
      - objectName: config.yaml
        secretPath: secret/data/gateway-startup/metadata
        secretKey: config
        filePermission: 0444
