name: Release Charts

on:
  issue_comment:
    types: [created]

jobs:
  release:
    # Only run if:
    # 1. Comment is on a PR (not an issue)
    # 2. Comment contains "/release"
    # 3. PR is open (not closed/merged yet)
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/release') &&
      github.event.issue.state == 'open'
    permissions:
      contents: write # to push chart release and create a release (helm/chart-releaser-action)
      pull-requests: read # to read PR details and reviews

    runs-on: ubuntu-latest
    outputs:
      changed_charts: ${{ steps.chart-releaser.outputs.changed_charts }}
      chart_version: ${{ steps.chart-releaser.outputs.chart_version }}

    steps:
      - name: Authorize release and check approval
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const allowedPermissions = new Set(['write', 'maintain', 'admin']);

            const getRepositoryPermission = async (username) => {
              const response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username
              });
              return response.data.permission;
            };

            // An approved PR can intentionally wait for tests or the final
            // release decision. Only a trusted repository user may publish it.
            const commenter = context.payload.comment.user.login;
            const commenterPermission = await getRepositoryPermission(commenter);

            if (!allowedPermissions.has(commenterPermission)) {
              core.setFailed(
                `User ${commenter} cannot trigger a release: repository permission ` +
                `${commenterPermission} is below write.`
              );
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Check if PR is open
            if (pr.data.state !== 'open') {
              core.setFailed('PR is not open. Cannot release.');
              return;
            }

            // Keep the latest decisive review state for each reviewer. A later
            // CHANGES_REQUESTED or DISMISSED review must not leave an older
            // approval eligible for release.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });

            const decisiveStates = new Set(['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED']);
            const latestReviewByUser = new Map();

            for (const review of reviews) {
              const reviewer = review.user?.login;
              if (reviewer && decisiveStates.has(review.state)) {
                latestReviewByUser.set(reviewer, review);
              }
            }

            const approvedReviews = [...latestReviewByUser.values()]
              .filter(review => review.state === 'APPROVED');

            const approvedReviewersWithPermission = await Promise.all(
              approvedReviews.map(async review => ({
                review,
                permission: await getRepositoryPermission(review.user.login)
              }))
            );

            const authorizedApprovals = approvedReviewersWithPermission
              .filter(({ permission }) => allowedPermissions.has(permission));

            if (authorizedApprovals.length === 0) {
              core.setFailed(
                'PR must be approved by a reviewer with write, maintain, or admin permission.'
              );
              return;
            }

            core.info(
              `Release triggered by ${commenter} (${commenterPermission}); ` +
              `authorized approval from: ${authorizedApprovals
                .map(({ review, permission }) => `${review.user.login} (${permission})`)
                .join(', ')}`
            );

            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_sha }}  # Checkout the PR branch HEAD

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Extract version from Helm chart metadata
        id: extract-version
        run: |
          VERSION=$(grep '^version:' charts/redis-enterprise-operator/Chart.yaml | awk '{print $2}')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Create and push release tag
        run: |
          VERSION="${{ steps.extract-version.outputs.version }}"
          TAG_NAME="redis-enterprise-operator-$VERSION"

          # Create the tag
          git tag "$TAG_NAME"

          # Push the tag
          git push origin "$TAG_NAME"

          echo "Created and pushed tag: $TAG_NAME"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.9.2

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        id: chart-releaser
        env:
          CR_TOKEN: "${{ github.token }}"

  generate-page:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit the generated file
    needs:
      - release
    if: needs.release.outputs.changed_charts != ''   # Only run when charts changed
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Generate Helm Charts HTML
        uses: ./.github/actions/generate-helm-html-index
        with:
          index_file: 'index.yaml'
          output_file: 'index.html'

      - name: Commit and Push
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"  
          git add index.html
          git commit -m "Update Helm charts page version: ${{ needs.release.outputs.changed_charts  }}" || exit 0  # Don't fail if no changes
          git push

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Needed to deploy to GitHub Pages
      pages: write
    needs:
      - generate-page
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
