name: Release Charts

# Releases are started manually by someone with write access to the
# repository.
#
# The workflow definition always comes from master. The chart is released
# from a branch of this repository: master, or a version branch such as
# 7.22.2-47 for maintenance releases of older lines.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to release the chart from (master or a version branch, e.g. 7.22.2-47).
        required: true
        default: master
        type: string

concurrency:
  group: release-redis-enterprise-operator
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # to push chart release and create a release (helm/chart-releaser-action)

    runs-on: ubuntu-latest
    outputs:
      changed_charts: ${{ steps.chart-releaser.outputs.changed_charts }}
      chart_version: ${{ steps.chart-releaser.outputs.chart_version }}

    steps:
      - name: Verify workflow and release branch
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "master" ]; then
            echo "This workflow can only be run from master. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [ "$RELEASE_BRANCH" != "master" ] && ! [[ "$RELEASE_BRANCH" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::Release branch must be master or a version branch such as 7.22.2-47, got: $RELEASE_BRANCH"
            exit 1
          fi

      # refs/heads/ restricts the checkout to a branch of this repository, never
      # a pull request head, tag or arbitrary commit.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/${{ inputs.branch }}

      - name: Resolve release commit
        id: release-commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing $(git rev-parse HEAD)"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Extract version from Helm chart metadata
        id: extract-version
        run: |
          VERSION=$(grep '^version:' charts/redis-enterprise-operator/Chart.yaml | awk '{print $2}')

          if ! [[ "$VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::Unexpected chart version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      # The tag is pushed before packaging, so a run that failed later already
      # left it behind. Reuse it only when it points at this commit, so a
      # re-run resumes packaging and index publication; a tag on any other
      # commit is a conflict and stops the release.
      - name: Create and push release tag
        env:
          VERSION: ${{ steps.extract-version.outputs.version }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        run: |
          TAG_NAME="redis-enterprise-operator-$VERSION"

          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME" 2>/dev/null || true
          if existing=$(git rev-parse -q --verify "refs/tags/$TAG_NAME^{commit}"); then
            if [ "$existing" != "$RELEASE_SHA" ]; then
              echo "::error::Tag $TAG_NAME already points at $existing, not $RELEASE_SHA"
              exit 1
            fi
            echo "Reusing existing tag $TAG_NAME at $RELEASE_SHA"
            exit 0
          fi

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          echo "Created and pushed tag: $TAG_NAME"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.9.2

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        id: chart-releaser
        env:
          CR_TOKEN: "${{ github.token }}"

  generate-page:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit the generated file
    needs:
      - release
    if: needs.release.outputs.changed_charts != ''   # Only run when charts changed
    steps:
      # The page generator comes from the release commit on master, never from
      # gh-pages, so nothing executed here can be changed by a gh-pages push.
      - name: Checkout generator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Checkout Pages content
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Helm Charts HTML
        run: |
          python -m pip install pyyaml packaging
          python .github/scripts/generate_helm_index.py .pages/index.yaml \
            --output .pages/index.html \
            --repo-url https://helm.redis.io

      - name: Commit and Push
        working-directory: .pages
        env:
          CHANGED_CHARTS: ${{ needs.release.outputs.changed_charts }}
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add index.html
          git commit -m "Update Helm charts page version: $CHANGED_CHARTS" || exit 0  # Don't fail if no changes
          git push origin HEAD:gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Needed to deploy to GitHub Pages
      pages: write
    needs:
      - generate-page
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
